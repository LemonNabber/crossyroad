<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossy Road Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #markerToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            user-select: none;
        }

        #markerToggle button {
            position: relative;
            width: 44px;
            height: 24px;
            border-radius: 12px;
            border: none;
            background: #666;
            cursor: pointer;
            transition: background 0.2s ease;
            padding: 0;
        }

        #markerToggle button::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            transition: transform 0.2s ease;
        }

        #markerToggle button.on {
            background: #4CAF50;
        }

        #markerToggle button.on::after {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>Crossy Road Game</div>
            <div>Use WASD or Arrow Keys to move</div>
            <div id="gameStatus"></div>
        </div>
        <div id="markerToggle">
            <span>Grid & Row Labels</span>
            <button id="markerToggleBtn" class="on" aria-pressed="true"></button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game Configuration
        const CONFIG = {
            WORLD: {
                GRID_SIZE: 20,           // Number of tiles per row/column
                TILE_SIZE: 2,            // Size of each tile
                VISIBLE_ROWS: 15,        // Number of rows to render at once
            },
            CAMERA: {
                FOV: 45,
                NEAR: 0.1,
                FAR: 1000,
                POSITION: { x: 0, y: 50, z: 30 },
                LOOK_AT: { x: 0, y: 0, z: 0 }
            },
            CARS: {
                WIDTH: 3.8,             // Car width (slightly less than 2 tiles)
                HEIGHT: 1.0,            // Car height (half a tile)
                DEPTH: 1.8,             // Car depth
                SPEED: 2.0,             // Units per second movement speed
                SPAWN_RATE: 0.1,        // Probability of spawning a car per second (reduced)
                MAX_CARS_PER_ROW: 5,    // Maximum cars per row
                MIN_GAP: 4.0,           // Minimum gap between cars
                COLORS: [0xff0000, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500] // Car colors
            },
            PLAYER: {
                SIZE: 0.8,              // Player cube size
                COLLISION_RADIUS: 0.7   // Collision detection radius
            }
        };

        // Ground Types
        const GROUND_TYPES = {
            GRASS: {
                name: 'grass',
                color: 0x90EE90,        // Pale green
                height: 0.1
            },
            STREET: {
                name: 'street',
                color: 0x808080,        // Grey
                height: 0.05
            }
            // Future ground types will be added here
            // WATER: { name: 'water', color: 0x4169E1, height: -0.1 }
        };

        class GameWorld {
            constructor() {
                this.rows = new Map();
                this.currentPlayerRow = 0;
                this.worldOffset = 0;
                this.lastCarSpawnTime = 0;
            }

            // Generate a row configuration
            generateRow(rowIndex) {
                let groundType;
                let carDirection = null;
                
                if (rowIndex < 8) {
                    // Rows 0-7 are always grass
                    groundType = GROUND_TYPES.GRASS;
                } else {
                    // From row 8 onwards, randomly alternate between grass and street
                    // Use row index as seed for consistent results
                    const random = Math.sin(rowIndex * 12.9898) * 43758.5453;
                    const randomValue = random - Math.floor(random);
                    groundType = randomValue < 0.5 ? GROUND_TYPES.GRASS : GROUND_TYPES.STREET;
                    
                    // If it's a street, determine car direction
                    if (groundType === GROUND_TYPES.STREET) {
                        // Use different seed for direction to avoid correlation
                        const dirRandom = Math.sin(rowIndex * 78.233) * 43758.5453;
                        const dirValue = dirRandom - Math.floor(dirRandom);
                        carDirection = dirValue < 0.5 ? 'left' : 'right'; // left = left-to-right, right = right-to-left
                    }
                }
                
                const row = {
                    index: rowIndex,
                    groundType: groundType,
                    carDirection: carDirection,
                    cars: [],
                    tiles: this.generateTiles(rowIndex, groundType)
                };

                // Pre-populate street rows with cars
                if (groundType === GROUND_TYPES.STREET) {
                    this.generateInitialCars(row);
                }

                return row;
            }

            // Generate initial cars for a street row
            generateInitialCars(row) {
                const gridWidth = CONFIG.WORLD.GRID_SIZE * CONFIG.WORLD.TILE_SIZE;
                const numCars = Math.floor(Math.random() * 4) + 1; // 1-4 cars initially
                
                // Generate random positions across the row
                const positions = [];
                for (let i = 0; i < numCars; i++) {
                    let attempts = 0;
                    let validPosition = false;
                    
                    while (!validPosition && attempts < 20) {
                        // Random position across the visible area
                        const x = (Math.random() - 0.5) * gridWidth * 0.8; // 80% of grid width
                        
                        // Check if position is far enough from other cars
                        const tooClose = positions.some(pos => Math.abs(pos - x) < CONFIG.CARS.MIN_GAP);
                        
                        if (!tooClose) {
                            positions.push(x);
                            validPosition = true;
                        }
                        attempts++;
                    }
                }

                // Create cars at the valid positions
                positions.forEach(x => {
                    const car = {
                        x: x,
                        z: row.index,
                        color: CONFIG.CARS.COLORS[Math.floor(Math.random() * CONFIG.CARS.COLORS.length)],
                        id: Math.random().toString(36)
                    };
                    row.cars.push(car);
                });
            }

            // Generate tiles for a row
            generateTiles(rowIndex, groundType) {
                const tiles = [];
                for (let col = 0; col < CONFIG.WORLD.GRID_SIZE; col++) {
                    tiles.push({
                        x: col,
                        z: rowIndex,
                        groundType: groundType
                    });
                }
                return tiles;
            }

            // Convert row index to world Z coordinate
            // Row 0 should be closest to camera (highest Z value)
            rowToWorldZ(rowIndex) {
                return -rowIndex * CONFIG.WORLD.TILE_SIZE;
            }

            // Get or create a row
            getRow(rowIndex) {
                if (!this.rows.has(rowIndex)) {
                    this.rows.set(rowIndex, this.generateRow(rowIndex));
                }
                return this.rows.get(rowIndex);
            }

            // Get visible rows around the player or camera
            getVisibleRows(centerRow) {
                const rows = [];
                
                // Always show rows starting from 0 when player is at row 5 or below
                const displayCenterRow = Math.max(5, centerRow);
                
                // Always show exactly 15 rows starting from row 0 when camera is stationary
                // or 15 rows centered around the player when camera is following
                let startRow, endRow;
                
                if (centerRow <= 5) {
                    // Camera is stationary - show rows 0 through 14
                    startRow = 0;
                    endRow = 14;
                } else {
                    // Camera is following player - show 15 rows centered on player
                    const halfVisible = Math.floor(CONFIG.WORLD.VISIBLE_ROWS / 2);
                    startRow = Math.max(0, centerRow - halfVisible);
                    endRow = startRow + CONFIG.WORLD.VISIBLE_ROWS - 1;
                }
                
                for (let i = startRow; i <= endRow; i++) {
                    rows.push(this.getRow(i));
                }
                return rows;
            }

            // Update cars in all street rows
            updateCars(deltaTime, playerWorldX, playerWorldZ) {
                let playerHit = false;
                
                // Update existing cars
                this.rows.forEach(row => {
                    if (row.groundType === GROUND_TYPES.STREET) {
                        // Move existing cars
                        row.cars = row.cars.filter(car => {
                            const direction = row.carDirection === 'left' ? 1 : -1;
                            car.x += direction * CONFIG.CARS.SPEED * deltaTime;
                            
                            // Check collision with player
                            if (this.checkCarPlayerCollision(car, playerWorldX, playerWorldZ)) {
                                playerHit = true;
                            }
                            
                            // Remove cars that have moved off screen
                            const gridWidth = CONFIG.WORLD.GRID_SIZE * CONFIG.WORLD.TILE_SIZE;
                            return car.x > -gridWidth && car.x < gridWidth;
                        });

                        // Try to spawn new cars (only if under limit and random chance)
                        if (row.cars.length < CONFIG.CARS.MAX_CARS_PER_ROW && 
                            Math.random() < CONFIG.CARS.SPAWN_RATE * deltaTime) {
                            this.trySpawnCar(row);
                        }
                    }
                });

                return playerHit;
            }

            // Check collision between a car and the player
            checkCarPlayerCollision(car, playerWorldX, playerWorldZ) {
                // First check if they're on the same row (Z coordinate)
                const carWorldZ = -car.z * CONFIG.WORLD.TILE_SIZE;
                if (Math.abs(playerWorldZ - carWorldZ) > CONFIG.WORLD.TILE_SIZE / 2) {
                    return false; // Not on same row
                }
                
                // Then check if they overlap in X direction
                const carWorldX = car.x;
                const carHalfWidth = CONFIG.CARS.WIDTH / 2;
                const playerHalfSize = CONFIG.PLAYER.SIZE / 2;
                
                // Check if player overlaps with car in X direction
                const playerLeftEdge = playerWorldX - playerHalfSize;
                const playerRightEdge = playerWorldX + playerHalfSize;
                const carLeftEdge = carWorldX - carHalfWidth;
                const carRightEdge = carWorldX + carHalfWidth;
                
                // Collision occurs if player and car overlap in X direction
                return !(playerRightEdge < carLeftEdge || playerLeftEdge > carRightEdge);
            }

            // Try to spawn a new car on a street row (checks for collisions)
            trySpawnCar(row) {
                const gridWidth = CONFIG.WORLD.GRID_SIZE * CONFIG.WORLD.TILE_SIZE;
                const spawnX = row.carDirection === 'left' ? -gridWidth / 2 - 2 : gridWidth / 2 + 2;
                
                // Check if spawn position would collide with existing cars
                const wouldCollide = row.cars.some(existingCar => {
                    const distance = Math.abs(existingCar.x - spawnX);
                    return distance < CONFIG.CARS.MIN_GAP;
                });

                // Only spawn if no collision and under car limit
                if (!wouldCollide) {
                    this.spawnCar(row, spawnX);
                }
            }

            // Spawn a new car on a street row at specified position
            spawnCar(row, spawnX) {
                const car = {
                    x: spawnX,
                    z: row.index,
                    color: CONFIG.CARS.COLORS[Math.floor(Math.random() * CONFIG.CARS.COLORS.length)],
                    id: Math.random().toString(36)
                };
                row.cars.push(car);
            }
        }

        class GameRenderer {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(
                    CONFIG.CAMERA.FOV,
                    window.innerWidth / window.innerHeight,
                    CONFIG.CAMERA.NEAR,
                    CONFIG.CAMERA.FAR
                );
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: document.getElementById('gameCanvas'),
                    antialias: true 
                });
                
                this.tileGeometry = new THREE.BoxGeometry(
                    CONFIG.WORLD.TILE_SIZE, 
                    0.2, 
                    CONFIG.WORLD.TILE_SIZE
                );
                this.tileMaterials = new Map();
                this.tileInstances = new Map();
                this.gridLines = new Map();
                this.rowLabels = new Map();
                this.cars = new Map();
                this.player = null;
                this.showMarkers = true; // Toggles row/col grid lines and row number labels

                // Car geometry and materials
                this.carGeometry = new THREE.BoxGeometry(
                    CONFIG.CARS.WIDTH,
                    CONFIG.CARS.HEIGHT, 
                    CONFIG.CARS.DEPTH
                );
                this.carMaterials = new Map();

                this.init();
            }

            init() {
                // Setup renderer
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.setClearColor(0x87CEEB, 1);

                // Setup camera
                this.camera.position.set(
                    CONFIG.CAMERA.POSITION.x,
                    CONFIG.CAMERA.POSITION.y,
                    CONFIG.CAMERA.POSITION.z
                );
                this.camera.lookAt(
                    CONFIG.CAMERA.LOOK_AT.x,
                    CONFIG.CAMERA.LOOK_AT.y,
                    CONFIG.CAMERA.LOOK_AT.z
                );

                // Setup lighting
                this.setupLighting();

                // Create materials for ground types
                this.createMaterials();

                // Handle window resize
                window.addEventListener('resize', () => this.onWindowResize());
            }

            setupLighting() {
                // Ambient light for even lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                // Directional light for depth
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 20, 5);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                directionalLight.shadow.camera.near = 0.5;
                directionalLight.shadow.camera.far = 50;
                directionalLight.shadow.camera.left = -25;
                directionalLight.shadow.camera.right = 25;
                directionalLight.shadow.camera.top = 25;
                directionalLight.shadow.camera.bottom = -25;
                this.scene.add(directionalLight);
            }

            createMaterials() {
                // Create materials for ground types
                for (const [key, groundType] of Object.entries(GROUND_TYPES)) {
                    const material = new THREE.MeshLambertMaterial({ 
                        color: groundType.color 
                    });
                    this.tileMaterials.set(groundType.name, material);
                }

                // Create grid line materials
                this.blackLineMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x000000, 
                    linewidth: 1,
                    transparent: true,
                    opacity: 0.8
                });
                this.whiteLineMaterial = new THREE.LineBasicMaterial({ 
                    color: 0xffffff, 
                    linewidth: 1,
                    transparent: true,
                    opacity: 0.8
                });

                // Create player material and geometry
                this.playerGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                this.playerMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0xffffff 
                });

                // Create car materials for each color
                CONFIG.CARS.COLORS.forEach((color, index) => {
                    const material = new THREE.MeshLambertMaterial({ color: color });
                    this.carMaterials.set(color, material);
                });
            }

            renderWorld(world, playerRow) {
                // Clear existing tiles, grid lines, and labels
                this.clearTiles();
                this.clearGridLines();
                this.clearRowLabels();
                this.clearCars();

                // Get visible rows
                const visibleRows = world.getVisibleRows(playerRow);

                // Render each row
                visibleRows.forEach(row => {
                    this.renderRow(row);
                });

                // Render grid lines and row labels, only when markers are enabled
                if (this.showMarkers) {
                    this.renderGridLines(visibleRows);
                    this.renderRowLabels(visibleRows);
                }

                // Render cars
                visibleRows.forEach(row => {
                    if (row.groundType === GROUND_TYPES.STREET) {
                        this.renderCars(row);
                    }
                });
            }

            createPlayer() {
                if (this.player) {
                    this.scene.remove(this.player);
                }
                
                this.player = new THREE.Mesh(this.playerGeometry, this.playerMaterial);
                this.player.castShadow = true;
                this.scene.add(this.player);
            }

            updatePlayer(playerGridX, playerGridZ) {
                if (!this.player) {
                    this.createPlayer();
                }

                // Convert grid coordinates to world coordinates
                const worldX = (playerGridX - CONFIG.WORLD.GRID_SIZE / 2) * CONFIG.WORLD.TILE_SIZE;
                const worldZ = -playerGridZ * CONFIG.WORLD.TILE_SIZE; // Negative to flip row direction
                const worldY = 0.6; // Position above the tile

                this.player.position.set(worldX, worldY, worldZ);
            }

            renderRow(row) {
                row.tiles.forEach(tile => {
                    this.renderTile(tile);
                });
            }

            renderTile(tile) {
                const material = this.tileMaterials.get(tile.groundType.name);
                const mesh = new THREE.Mesh(this.tileGeometry, material);
                
                // Position tile
                const worldX = (tile.x - CONFIG.WORLD.GRID_SIZE / 2) * CONFIG.WORLD.TILE_SIZE;
                const worldZ = -tile.z * CONFIG.WORLD.TILE_SIZE; // Negative to flip row direction
                const worldY = tile.groundType.height;
                
                mesh.position.set(worldX, worldY, worldZ);
                mesh.receiveShadow = true;
                
                // Store reference for cleanup
                const tileKey = `${tile.x}-${tile.z}`;
                this.tileInstances.set(tileKey, mesh);
                
                this.scene.add(mesh);
            }

            clearTiles() {
                // Remove all existing tile meshes
                this.tileInstances.forEach(mesh => {
                    this.scene.remove(mesh);
                });
                this.tileInstances.clear();
            }

            clearGridLines() {
                // Remove all existing grid lines
                this.gridLines.forEach(line => {
                    this.scene.remove(line);
                });
                this.gridLines.clear();
            }

            clearRowLabels() {
                // Remove all existing row labels
                this.rowLabels.forEach(label => {
                    this.scene.remove(label);
                });
                this.rowLabels.clear();
            }

            clearCars() {
                // Remove all existing cars
                this.cars.forEach(car => {
                    this.scene.remove(car);
                });
                this.cars.clear();
            }

            renderCars(row) {
                row.cars.forEach(car => {
                    const material = this.carMaterials.get(car.color);
                    const mesh = new THREE.Mesh(this.carGeometry, material);
                    
                    // Position car
                    const worldX = car.x;
                    const worldZ = -car.z * CONFIG.WORLD.TILE_SIZE;
                    const worldY = CONFIG.CARS.HEIGHT / 2 + 0.15; // Above the street
                    
                    mesh.position.set(worldX, worldY, worldZ);
                    mesh.castShadow = true;
                    
                    const carKey = `${car.id}`;
                    this.cars.set(carKey, mesh);
                    this.scene.add(mesh);
                });
            }

            createTextTexture(text, fontSize = 64, fontColor = 'white') {
                // Create a canvas to draw text on
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                // Set canvas size
                canvas.width = 128;
                canvas.height = 128;
                
                // Set font properties
                context.font = `${fontSize}px Arial`;
                context.fillStyle = fontColor;
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                
                // Clear canvas and draw text
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.fillText(text, canvas.width / 2, canvas.height / 2);
                
                // Create texture from canvas
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                
                return texture;
            }

            renderRowLabels(visibleRows) {
                visibleRows.forEach(row => {
                    const texture = this.createTextTexture(row.index.toString());
                    const material = new THREE.SpriteMaterial({ 
                        map: texture,
                        transparent: true
                    });
                    const sprite = new THREE.Sprite(material);
                    
                    // Position at the rightmost edge of the row
                    const rightmostX = (CONFIG.WORLD.GRID_SIZE / 2) * CONFIG.WORLD.TILE_SIZE;
                    const worldZ = -row.index * CONFIG.WORLD.TILE_SIZE;
                    const worldY = 1.5; // Above the tiles
                    
                    sprite.position.set(rightmostX, worldY, worldZ);
                    sprite.scale.set(2, 2, 2); // Make it visible but not too large
                    
                    const labelKey = `row-label-${row.index}`;
                    this.rowLabels.set(labelKey, sprite);
                    this.scene.add(sprite);
                });
            }

            renderGridLines(visibleRows) {
                if (visibleRows.length === 0) return;

                const minRow = visibleRows[0].index;
                const maxRow = visibleRows[visibleRows.length - 1].index;
                const gridWidth = CONFIG.WORLD.GRID_SIZE * CONFIG.WORLD.TILE_SIZE;
                const lineHeight = 0.25; // Slightly above the tiles

                // Black lines through rows (horizontal lines) - at tile edges
                for (let rowIndex = minRow; rowIndex <= maxRow + 1; rowIndex++) {
                    const geometry = new THREE.BufferGeometry();
                    // Position at the edge of tiles with flipped Z coordinate
                    const z = (-rowIndex * CONFIG.WORLD.TILE_SIZE) + (CONFIG.WORLD.TILE_SIZE / 2);
                    const startX = -gridWidth / 2;
                    const endX = gridWidth / 2;

                    const points = [
                        new THREE.Vector3(startX, lineHeight, z),
                        new THREE.Vector3(endX, lineHeight, z)
                    ];

                    geometry.setFromPoints(points);
                    const line = new THREE.Line(geometry, this.blackLineMaterial);
                    
                    const lineKey = `row-${rowIndex}`;
                    this.gridLines.set(lineKey, line);
                    this.scene.add(line);
                }

                // White lines through columns (vertical lines) - at tile edges
                for (let col = 0; col <= CONFIG.WORLD.GRID_SIZE; col++) {
                    const geometry = new THREE.BufferGeometry();
                    // Position at the edge of tiles (subtract half tile size to align with edges)
                    const x = ((col - CONFIG.WORLD.GRID_SIZE / 2) * CONFIG.WORLD.TILE_SIZE) - (CONFIG.WORLD.TILE_SIZE / 2);
                    const startZ = (-minRow * CONFIG.WORLD.TILE_SIZE) + (CONFIG.WORLD.TILE_SIZE / 2);
                    const endZ = (-(maxRow + 1) * CONFIG.WORLD.TILE_SIZE) + (CONFIG.WORLD.TILE_SIZE / 2);

                    const points = [
                        new THREE.Vector3(x, lineHeight, startZ),
                        new THREE.Vector3(x, lineHeight, endZ)
                    ];

                    geometry.setFromPoints(points);
                    const line = new THREE.Line(geometry, this.whiteLineMaterial);
                    
                    const lineKey = `col-${col}-${minRow}-${maxRow}`;
                    this.gridLines.set(lineKey, line);
                    this.scene.add(line);
                }
            }

            updateCamera(playerRow) {
                // Only follow player if they're at row 5 or beyond
                // If player is at row 4 or lower, keep camera at row 5 position
                const cameraFollowRow = Math.max(5, playerRow);
                
                // Follow player row - with flipped Z coordinate
                const targetZ = -cameraFollowRow * CONFIG.WORLD.TILE_SIZE + CONFIG.CAMERA.POSITION.z;
                this.camera.position.z = targetZ;
                
                const lookAtZ = -cameraFollowRow * CONFIG.WORLD.TILE_SIZE;
                this.camera.lookAt(CONFIG.CAMERA.LOOK_AT.x, CONFIG.CAMERA.LOOK_AT.y, lookAtZ);
            }

            render() {
                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        class Game {
            constructor() {
                this.world = new GameWorld();
                this.renderer = new GameRenderer();
                this.playerGridX = Math.floor(CONFIG.WORLD.GRID_SIZE / 2); // Center column
                this.playerGridZ = 4; // Start at row 4
                this.isRunning = false;
                this.lastTime = 0;
                this.isPlayerDead = false;
                this.deathTime = 0;
                this.respawnDelay = 2.0; // 2 seconds

                // Tracks the furthest-forward row the player has ever reached.
                // The map/camera are driven by this value, not by the player's
                // current row - so the visible rows and camera position only
                // ever move forward (once the player passes row 5) and never
                // slide back when the player steps backward. The player is
                // still free to walk back and forth across whatever rows are
                // currently visible.
                this.maxRowReached = this.playerGridZ;

                this.init();
            }

            init() {
                // Setup input handling
                this.setupInput();

                // Initial render
                this.update();

                // Start game loop
                this.start();
            }

            setupInput() {
                // Grid/row-label marker toggle button
                const markerToggleBtn = document.getElementById('markerToggleBtn');
                if (markerToggleBtn) {
                    markerToggleBtn.addEventListener('click', () => {
                        this.renderer.showMarkers = !this.renderer.showMarkers;
                        markerToggleBtn.classList.toggle('on', this.renderer.showMarkers);
                        markerToggleBtn.setAttribute('aria-pressed', this.renderer.showMarkers.toString());
                        this.update();
                    });
                }

                document.addEventListener('keydown', (event) => {
                    switch(event.code) {
                        case 'KeyW':
                        case 'ArrowUp':
                            this.movePlayer(0, 1); // Move forward (positive Z)
                            break;
                        case 'KeyS':
                        case 'ArrowDown':
                            this.movePlayer(0, -1); // Move backward (negative Z)
                            break;
                        case 'KeyA':
                        case 'ArrowLeft':
                            this.movePlayer(-1, 0); // Move left (negative X)
                            break;
                        case 'KeyD':
                        case 'ArrowRight':
                            this.movePlayer(1, 0); // Move right (positive X)
                            break;
                    }
                });
            }

            // Mirrors GameWorld.getVisibleRows' windowing logic to find the
            // lowest row index currently visible, based on progress made
            // (maxRowReached), so the player can't wander back past what's
            // actually rendered.
            getVisibleStartRow() {
                if (this.maxRowReached <= 5) {
                    return 0;
                }
                const halfVisible = Math.floor(CONFIG.WORLD.VISIBLE_ROWS / 2);
                return Math.max(0, this.maxRowReached - halfVisible);
            }

            movePlayer(deltaX, deltaZ) {
                // Don't allow movement if player is dead
                if (this.isPlayerDead) {
                    return;
                }

                // Update player grid position
                this.playerGridX += deltaX;
                this.playerGridZ += deltaZ;

                // Clamp player position to valid grid bounds for X
                this.playerGridX = Math.max(0, Math.min(CONFIG.WORLD.GRID_SIZE - 1, this.playerGridX));

                // Clamp player position to not go below row 0, and not go
                // behind the lowest row currently visible on the map - the
                // player can freely roam the visible rows, but can't wander
                // off into rows that have scrolled out of view.
                const minVisibleRow = this.getVisibleStartRow();
                this.playerGridZ = Math.max(minVisibleRow, Math.max(0, this.playerGridZ));

                // Record the furthest-forward progress made so far. The map
                // and camera are driven by this value, so moving backward
                // never affects them - they only advance once the player
                // pushes past their previous best.
                this.maxRowReached = Math.max(this.maxRowReached, this.playerGridZ);

                this.update();
            }

            update() {
                // Render the world based on the furthest progress made, not
                // the player's current row - this keeps the map static while
                // the player moves backward, and only shifts it forward once
                // the player passes their previous furthest row.
                this.renderer.renderWorld(this.world, this.maxRowReached);
                
                // Update player position - the player itself can move freely
                // within whatever rows are currently visible.
                this.renderer.updatePlayer(this.playerGridX, this.playerGridZ);
                
                // Camera follows the furthest progress made, same as the map
                this.renderer.updateCamera(this.maxRowReached);
                
                // Render frame
                this.renderer.render();
            }

            start() {
                this.isRunning = true;
                this.gameLoop();
            }

            gameLoop() {
                if (!this.isRunning) return;

                // Calculate delta time
                const currentTime = performance.now() / 1000; // Convert to seconds
                const deltaTime = this.lastTime ? currentTime - this.lastTime : 0;
                this.lastTime = currentTime;

                // Handle death and respawn
                if (this.isPlayerDead) {
                    if (currentTime - this.deathTime > this.respawnDelay) {
                        this.respawnPlayer();
                    }
                } else {
                    // Calculate player world position
                    const playerWorldX = (this.playerGridX - CONFIG.WORLD.GRID_SIZE / 2) * CONFIG.WORLD.TILE_SIZE;
                    const playerWorldZ = -this.playerGridZ * CONFIG.WORLD.TILE_SIZE;

                    // Update cars and check for collisions
                    const playerHit = this.world.updateCars(deltaTime, playerWorldX, playerWorldZ);

                    if (playerHit) {
                        this.killPlayer();
                    }
                }

                // Update game state
                this.update();

                // Continue loop
                requestAnimationFrame(() => this.gameLoop());
            }

            killPlayer() {
                this.isPlayerDead = true;
                this.deathTime = performance.now() / 1000;
                console.log("Player died! Respawning in", this.respawnDelay, "seconds...");
                
                // Visual feedback - make player red
                if (this.renderer.player) {
                    this.renderer.player.material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                }

                // Update UI
                document.getElementById('gameStatus').textContent = 'You died! Respawning...';
                document.getElementById('gameStatus').style.color = 'red';
            }

            respawnPlayer() {
                this.isPlayerDead = false;
                this.playerGridX = Math.floor(CONFIG.WORLD.GRID_SIZE / 2); // Reset to center
                this.playerGridZ = 4; // Reset to starting row
                this.maxRowReached = this.playerGridZ; // Reset progress tracking on death/respawn
                console.log("Player respawned!");
                
                // Reset player color to white
                if (this.renderer.player) {
                    this.renderer.player.material = this.renderer.playerMaterial;
                }

                // Update UI
                document.getElementById('gameStatus').textContent = '';
            }

            stop() {
                this.isRunning = false;
            }
        }

        // Initialize game when page loads
        window.addEventListener('load', () => {
            const game = new Game();
            
            // Make game accessible globally for debugging
            window.game = game;
            
            console.log('Crossy Road game initialized!');
            console.log('Use WASD or Arrow Keys to move');
            console.log('Current ground types:', GROUND_TYPES);
        });
    </script>
</body>
</html>
